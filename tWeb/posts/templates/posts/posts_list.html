{% extends 'layout.html' %}

{% block title %}
    Posts
{% endblock %}
{% block content %}
<section>
    <h1 class= "page-title">Posts</h1>
    {% for post in posts %}
        <article class="post"></article>
            <h2>
                <a href= "{% url 'posts:page' slug=post.slug %}">
                    {{ post.title}}
                </a>
            </h2>
            <p> {{ post.date}} by  {{post.author}}</p>
            
    {% endfor %}
</section>
{% endblock %}
